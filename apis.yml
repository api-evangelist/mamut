name: Mamut
description: 'Mamut was a Norwegian business software company (Mamut ASA / Mamut AS) that
  provided accounting, ERP, CRM, e-commerce and online-presence software to small and
  medium-sized businesses across the Nordics and parts of Europe. It was acquired by
  Visma in 2011 and the Mamut product line has since been absorbed into the Visma family
  of business software. This profile was surfaced as a portfolio company of Northzone
  and added to the API Evangelist network as a stub for enrichment. As of this pass the
  mamut.com web server is unreachable (both HTTP and HTTPS time out) and there is no
  reachable public developer portal, API documentation, or machine-readable API surface
  under the Mamut brand; enrichment therefore captured only what could be probed from
  DNS/TLS. Sector: enterprise.'
